spring.application.name=currency-service

# External API Configuration
currency.api.base-url=https://open.er-api.com/v6/latest
currency.api.base-currency=USD

# Scheduler Configuration (every 1 hour, initial delay 5 seconds)
currency.schedule.fixed-rate-ms=3600000
currency.schedule.initial-delay-ms=5000

# Dedicated task scheduler pool size to prevent thread starvation
spring.task.scheduling.pool.size=2
